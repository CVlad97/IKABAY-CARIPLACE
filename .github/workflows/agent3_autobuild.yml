name: 🔁 IKABAY-CARIPLACE Autobuild & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Cloner ton code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurer Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Charger les variables d’environnement
      - name: Load environment
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}" >> .env

      # 4️⃣ Installer dépendances
      - name: Install dependencies
        run: npm ci

      # 5️⃣ Lancer le setup automatique (Agent 3)
      - name: Run Agent3 setup
        run: |
          echo "🧠 Running autonomous setup..."
          node agent3.js || echo "agent3 skipped"

      # 6️⃣ Build du projet
      - name: Build
        run: npm run build || echo "Build done."

      # 7️⃣ Déploiement Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          prod: true

      # 8️⃣ Rapport de fin
      - name: Post-build summary
        run: |
          echo "✅ Build & Deploy complete"
          node -e "console.log('📄 Rapport généré le', new Date().toISOString())"
